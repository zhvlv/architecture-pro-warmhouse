openapi: 3.1.0
info:
  title: Автоматизация — целевой контракт, не реализован
  version: 0.1.0-target
  description: ПЛАН. В MVP не реализованы ни сервис, ни очередь выполнения сценариев. Сервис будет владеть сценариями
    и запусками, подписываться на telemetry.recorded в RabbitMQ и вызывать команды Devices. Все устройства условия/действий
    должны принадлежать указанному дому; доступ проверяется через Homes и OIDC. Условия — структурированные данные,
    не выполняемый пользовательский код.
servers:
- url: https://api.warmhouse.example
  description: Проектируемый адрес; сервиса в MVP нет
x-implementation-status: planned
paths:
  /api/v1/scenarios:
    get:
      operationId: listScenarios
      summary: Получить сценарии дома
      tags:
      - Сценарии
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
              example:
              - id: 1
                house_id: 1
                name: Включить отопление при похолодании
                enabled: true
                condition:
                  device_id: 7
                  metric: temperature
                  operator: lt
                  threshold: 18
                actions:
                - device_id: 9
                  action: turn_on
                created_at: '2026-11-18T14:00:00Z'
                updated_at: '2026-11-18T14:00:00Z'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid request
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '403':
          description: Нет доступа к дому
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: House access denied
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Resource not found
        '503':
          description: База данных или зависимый сервис недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Required service is unavailable
      parameters:
      - name: house_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        example: 1
    post:
      operationId: createScenario
      summary: Создать сценарий
      tags:
      - Сценарии
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
              example:
                id: 1
                house_id: 1
                name: Включить отопление при похолодании
                enabled: true
                condition:
                  device_id: 7
                  metric: temperature
                  operator: lt
                  threshold: 18
                actions:
                - device_id: 9
                  action: turn_on
                created_at: '2026-11-18T14:00:00Z'
                updated_at: '2026-11-18T14:00:00Z'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid request
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '403':
          description: Нет доступа к дому
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: House access denied
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Resource not found
        '503':
          description: База данных или зависимый сервис недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Required service is unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
            example:
              house_id: 1
              name: Включить отопление при похолодании
              enabled: true
              condition:
                device_id: 7
                metric: temperature
                operator: lt
                threshold: 18
              actions:
              - device_id: 9
                action: turn_on
  /api/v1/scenarios/{scenarioId}:
    parameters:
    - name: scenarioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
      example: 1
    get:
      operationId: getScenario
      summary: Получить сценарий
      tags:
      - Сценарии
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
              example:
                id: 1
                house_id: 1
                name: Включить отопление при похолодании
                enabled: true
                condition:
                  device_id: 7
                  metric: temperature
                  operator: lt
                  threshold: 18
                actions:
                - device_id: 9
                  action: turn_on
                created_at: '2026-11-18T14:00:00Z'
                updated_at: '2026-11-18T14:00:00Z'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid request
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '403':
          description: Нет доступа к дому
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: House access denied
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Resource not found
        '503':
          description: База данных или зависимый сервис недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Required service is unavailable
  /api/v1/scenarios/{scenarioId}/enabled:
    parameters:
    - name: scenarioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
      example: 1
    patch:
      operationId: setScenarioEnabled
      summary: Включить или выключить сценарий
      tags:
      - Сценарии
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
              example:
                id: 1
                house_id: 1
                name: Включить отопление при похолодании
                enabled: false
                condition:
                  device_id: 7
                  metric: temperature
                  operator: lt
                  threshold: 18
                actions:
                - device_id: 9
                  action: turn_on
                created_at: '2026-11-18T14:00:00Z'
                updated_at: '2026-11-18T14:00:00Z'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid request
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '403':
          description: Нет доступа к дому
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: House access denied
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Resource not found
        '503':
          description: База данных или зависимый сервис недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Required service is unavailable
      description: Повторная установка того же enabled идемпотентна. Уже принятые запуски этим запросом не отменяются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
              additionalProperties: false
            example:
              enabled: false
  /api/v1/scenarios/{scenarioId}/runs:
    parameters:
    - name: scenarioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
      example: 1
    post:
      operationId: runScenario
      summary: Поставить сценарий на выполнение
      tags:
      - Запуски
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'
              example:
                id: d1290bb5-2816-4301-b37d-0bb149945c4c
                scenario_id: 1
                status: accepted
                requested_at: '2026-11-18T14:00:00Z'
                completed_at: null
                error: null
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid request
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication required
        '403':
          description: Нет доступа к дому
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: House access denied
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Resource not found
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: State conflict
        '503':
          description: База данных или зависимый сервис недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Required service is unavailable
      description: 202 означает принятие, не исполнение физических команд. Отключённый сценарий — 409. На этапе
        реализации потребуются outbox, дедупликация событий по event_id и политика повторов/ошибок команд. В этом
        контракте каждый ручной POST создаёт новый запуск.
security:
- oidc: []
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          minLength: 1
      required:
      - error
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
      - status
      additionalProperties: false
    Message:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required:
      - message
      additionalProperties: false
    DeviceType:
      type: string
      enum:
      - temperature
      - heating
      - light
      - gate
      - camera
    Status:
      type: string
      enum:
      - active
      - inactive
      - error
    DeviceState:
      oneOf:
      - type: object
        maxProperties: 0
        additionalProperties: false
      - type: object
        properties:
          power:
            type: string
            enum:
            - 'on'
            - 'off'
        required:
        - power
        additionalProperties: false
      - type: object
        properties:
          position:
            type: string
            enum:
            - open
            - closed
        required:
        - position
        additionalProperties: false
      - type: object
        properties:
          streaming:
            type: boolean
        required:
        - streaming
        additionalProperties: false
    CommandInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - turn_on
          - turn_off
          - open
          - close
          - start_stream
          - stop_stream
      required:
      - action
      additionalProperties: false
    Command:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        action:
          type: string
          maxLength: 30
          minLength: 1
        status:
          type: string
          const: completed
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/DeviceState'
      required:
      - id
      - device_id
      - action
      - status
      - created_at
      - completed_at
      - state
      additionalProperties: false
    Condition:
      type: object
      properties:
        device_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        metric:
          type: string
          maxLength: 64
          minLength: 1
        operator:
          type: string
          enum:
          - lt
          - lte
          - gt
          - gte
          - eq
        threshold:
          type: number
      required:
      - device_id
      - metric
      - operator
      - threshold
      additionalProperties: false
    Action:
      type: object
      properties:
        device_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        action:
          type: string
          maxLength: 30
          minLength: 1
      required:
      - device_id
      - action
      additionalProperties: false
    Scenario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        house_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        name:
          type: string
          maxLength: 100
          minLength: 1
        enabled:
          type: boolean
        condition:
          $ref: '#/components/schemas/Condition'
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Action'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - house_id
      - name
      - enabled
      - condition
      - actions
      - created_at
      - updated_at
      additionalProperties: false
    ScenarioCreate:
      type: object
      properties:
        house_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        name:
          type: string
          maxLength: 100
          minLength: 1
        enabled:
          type: boolean
          default: true
        condition:
          $ref: '#/components/schemas/Condition'
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Action'
      required:
      - house_id
      - name
      - condition
      - actions
      additionalProperties: false
    ScenarioRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        status:
          type: string
          enum:
          - accepted
          - running
          - completed
          - failed
        requested_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - string
          - 'null'
      required:
      - id
      - scenario_id
      - status
      - requested_at
      - completed_at
      - error
      additionalProperties: false
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.warmhouse.example/.well-known/openid-configuration
      description: 'План: bearer access token, проверка подписи/issuer/audience и принадлежности дома субъекту.
        В MVP не реализовано.'
